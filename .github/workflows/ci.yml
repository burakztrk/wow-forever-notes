name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Keep the job id "build": main's branch protection requires this check, so
  # `gh pr merge --auto` waits for it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
