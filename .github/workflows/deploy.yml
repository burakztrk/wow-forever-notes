name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: "Announce every sitemap URL to IndexNow (Bing) after the deploy"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload the site
        uses: withastro/action@v3
        env:
          # Cloudflare Web Analytics beacon token: a repository *variable*
          # (Settings > Secrets and variables > Actions > Variables). It is
          # public, it ends up in the page source. Empty = no analytics script.
          PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing (IndexNow) which pages changed, once they are live: the posts this
  # push added or edited and the pages that list them (scripts/indexnow.mjs).
  # A failure here never fails the deploy.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Announce changed URLs
        env:
          BEFORE: ${{ github.event.before }}
          ALL: ${{ inputs.indexnow_all }}
        run: |
          if [ "$ALL" = "true" ]; then
            node scripts/indexnow.mjs --all
            exit $?
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "indexnow: no previous commit to compare with, skipping"
            exit 0
          fi
          git diff --name-only "$BEFORE" "$GITHUB_SHA" > changed.txt
          xargs -a changed.txt node scripts/indexnow.mjs --changed
