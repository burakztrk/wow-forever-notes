name: Notify app users

# Push notification to the Forever Campfire: Codex app when a push to main
# adds a post. scripts/notify.ts waits until the post is live on Pages, then
# sends one FCM topic message per post (notes-tr / notes-en). Days without a
# post (NO_UPDATES) have no push, so no notification.
#
# Secret: FCM_SERVICE_ACCOUNT_JSON (Firebase service account key, added by the
# repo owner under Settings → Secrets and variables → Actions). Without it the
# job only logs what it would send.

on:
  push:
    branches: [main]
    paths: ['src/content/blog/**']

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send notifications for new posts
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: npx tsx scripts/notify.ts --before "${{ github.event.before }}" --after "${{ github.sha }}" --wait-minutes 15
